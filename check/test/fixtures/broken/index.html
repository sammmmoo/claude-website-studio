<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome to our website</title>
  <style>
    body { margin:0; font:18px/1.6 system-ui, sans-serif; }
    header { display:flex; justify-content:space-between; padding:12px 16px; }
    /* The bug: this beats the browser's [hidden]{display:none}, so the menu never closes. */
    .mobile-nav { display:flex; flex-direction:column; }
    section { padding:48px 16px; }
    .hero { min-height:100vh; }
    .too-wide { width:600px; height:40px; background:#ccc; }
    /* The bug: hidden until JavaScript reveals it, with no reduced-motion fallback. */
    .reveal { opacity:0; transition:opacity .5s; }
    .reveal.in { opacity:1; }
  </style>
</head>
<body>
  <header>
    <span>Some Business</span>
    <button class="menu-toggle" aria-controls="site-menu" aria-expanded="false" aria-label="Open menu">Menu</button>
    <nav id="site-menu" class="mobile-nav" hidden>
      <a href="#services">Services</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>
  <main>
    <section class="hero">
      <h1>Welcome to our website</h1>
      <a href="tel:PHONE_NUMBER">Call us</a>
      <p><a href="services.html">All services</a> · <a href="gallery.html">Gallery</a></p>
      <img src="missing.jpg" alt="Our van">
    </section>
    <section id="services">
      <h2 class="reveal">Our services</h2>
      <p class="reveal">We do lots of things for lots of people.</p>
    </section>
    <section id="contact">
      <form data-check="enquiry-form">
        <label>Name <input name="name"></label>
        <label>Phone <input name="phone" type="tel"></label>
        <button type="submit">Send</button>
      </form>
    </section>
  </main>
  <script>
    const toggle = document.querySelector(".menu-toggle");
    const menu = document.getElementById("site-menu");
    toggle.addEventListener("click", () => { menu.hidden = !menu.hidden; });
    const io = new IntersectionObserver((es) => es.forEach((e) => e.isIntersecting && e.target.classList.add("in")));
    document.querySelectorAll(".reveal").forEach((el) => io.observe(el));
    document.querySelector("form").addEventListener("submit", (e) => { e.preventDefault(); console.log("sent"); });
  </script>
</body>
</html>
