<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quote form that sends by GET | Test</title>
  <style>body{margin:0;font:18px/1.6 system-ui,sans-serif;padding:16px}input,button{font:inherit;min-height:48px}</style>
</head>
<body>
  <h1>Leaks fixed in Example Town</h1>
  <p><a href="tel:+61491570111">Call 0491 570 111</a></p>
  <!-- Sends by GET: a real form service would get these details unless the check catches it. -->
  <form data-check="enquiry-form" action="https://forms.example.net/submit" method="get">
    <label>Name <input name="name" required></label>
    <label>Phone <input name="phone" type="tel" required></label>
    <button type="submit">Send</button>
  </form>
  <script>
    // An ad pixel firing a Lead event on submit: the check must not let this reach the ad platform.
    document.querySelector("form").addEventListener("submit", () => { new Image().src = "https://pixel.example.net/tr?ev=Lead"; });
  </script>
</body>
</html>
